<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صامولة للعملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* تطبيق العميل: جوال أولًا، ويتحول على الشاشة العريضة إلى متجر بعمودين.
     بطاقات ناعمة 16px وأزرار حبيّة؛ اللون البترولي على التوافق والإجراء فقط. */
  body { background: var(--ground); }
  .c-top { position: sticky; top: 0; z-index: 30; background: var(--ground); padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .c-top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
  .c-top .addr { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; background: none; border: 0; padding: 0; }
  .c-top .addr b { color: var(--text); font-weight: 500; }
  .c-top .addr svg { width: 15px; height: 15px; flex: none; }
  .c-top .spacer { flex: 1; }
  .c-top .desk { display: none; }
  .cart-btn { position: relative; }
  .badge { position: absolute; top: -4px; inset-inline-start: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .searchbar { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); flex: 1; min-width: 0; }
  .searchbar svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .searchbar input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 100%; font-size: 15px; }
  .searchbar input::placeholder { color: var(--faint); }
  .searchbar:focus-within { border-color: var(--text); }

  .c-main { max-width: 1180px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
  .c-main > * { min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-width: 0; }
  .card > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .card h2, .sec h2 { font-size: 16px; font-weight: 600; line-height: 1.35; }
  .sec { display: grid; gap: 12px; }
  .sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1.title { font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
  .sub { color: var(--muted); }

  /* السيارة */
  .vehicle { display: flex; align-items: center; gap: 14px; }
  .vehicle .car { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .vehicle .car svg { width: 28px; height: 28px; }
  .vehicle .name { font-size: 17px; font-weight: 600; line-height: 1.3; }
  .vehicle .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }

  /* إعلانات الرئيسية: شريحة تملأ العرض وتُسحب بالإصبع، والنقاط تحتها */
  .promo { display: grid; gap: 10px; }
  .promo-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 18px; overscroll-behavior-x: contain; }
  .promo-track::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 100%; scroll-snap-align: start; aspect-ratio: 16 / 9; min-height: 196px; border-radius: 18px; overflow: hidden; background: #15181a; color: #fff; isolation: isolate; }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 6s var(--ease); }
  .slide::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to left, rgba(10, 12, 13, 0.78) 0%, rgba(10, 12, 13, 0.5) 45%, rgba(10, 12, 13, 0) 78%); }
  .slide.is-on img { transform: scale(1.04); }
  .slide .s-copy { position: absolute; inset-block: 0; inset-inline-start: 0; width: min(74%, 400px); padding: 18px 20px; display: grid; align-content: center; justify-items: start; gap: 6px; }
  .slide .kick { font-size: 12.5px; font-weight: 600; color: #9fe3f0; }
  .slide h3 { font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
  .slide p { font-size: 13px; line-height: 1.5; color: rgba(255, 255, 255, 0.86); }
  .slide .go { margin-top: 6px; height: 36px; padding: 0 16px; border-radius: 999px; background: #fff; color: #111; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
  .slide .go svg { width: 15px; height: 15px; }
  .slide .go:hover { background: #e9edf0; }
  .dots { display: flex; justify-content: center; gap: 2px; }
  .dots button { width: 22px; height: 22px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
  .dots button::after { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--control); transition: width 220ms var(--ease), background-color 220ms ease; }
  .dots button[aria-current="true"]::after { width: 18px; background: var(--text); }

  /* شريط الوعود: ثلاث حقائق قصيرة تحت الإعلان */
  .perks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .perk { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 12px 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; line-height: 1.35; color: var(--muted); }
  .perk b { color: var(--text); font-size: 13px; font-weight: 600; }
  .perk svg { width: 20px; height: 20px; color: var(--accent); }
  .strip { display: grid; gap: 16px; }
  .strip > .card { align-self: stretch; display: grid; align-content: center; }

  /* التصنيفات: شبكة صور ثابتة بلا تمرير جانبي */
  .cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .cat { display: grid; gap: 0; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; font-size: 12.5px; font-weight: 500; text-align: center; line-height: 1.3; transition: border-color 150ms ease, transform 150ms var(--ease); }
  .cat .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 0; }
  .cat > span:last-child { padding: 8px 6px 10px; min-height: 40px; display: grid; place-items: center; }
  .cat:hover { border-color: var(--control); }
  .cat:active { transform: scale(0.98); }
  .cat[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }

  /* بطاقات المنتجات بالصور */
  .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .pcard { display: grid; grid-template-rows: auto 1fr; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; min-width: 0; transition: border-color 150ms ease, transform 150ms var(--ease); }
  .pcard:hover { border-color: var(--control); }
  .pcard:active { transform: scale(0.985); }
  .pcard .thumb { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 0; }
  .pcard .body { display: grid; gap: 6px; padding: 10px 12px 12px; align-content: start; min-width: 0; }
  .pcard .nm { font-weight: 600; line-height: 1.35; font-size: 14px; }
  .pcard .ref { color: var(--muted); font-size: 12px; }
  .pcard .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 2px; }
  .pcard .meta .money { font-weight: 700; font-size: 15px; }
  .pcard .meta .n { font-size: 12px; color: var(--muted); }
  .pcard .fitp { justify-self: start; }

  /* بطاقة الصورة: لا تدفع قبل الحجز */
  .how-card { padding: 0; overflow: hidden; }
  .how-card > img { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; display: block; }
  .how-card .in { padding: 16px; }

  /* صفوف القطع */
  .plist { display: grid; }
  .prow { display: flex; gap: 12px; align-items: center; padding: 12px 0; min-width: 0; }
  .prow + .prow { border-top: 1px solid var(--rule); }
  .prow .info { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .prow .nm { font-weight: 500; line-height: 1.35; }
  .prow .line2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .prow .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .prow .price { flex: none; white-space: nowrap; }
  .prow .price .from { font-size: 12px; color: var(--muted); }
  .prow .price .money { font-weight: 700; font-size: 15px; color: var(--text); }
  .prow .thumb { width: 64px; height: 64px; border-radius: 10px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--control); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: transparent; }
  .chip svg { width: 15px; height: 15px; }

  /* صفحة القطعة */
  .crumbs { display: none; gap: 6px; color: var(--muted); font-size: 13px; align-items: center; flex-wrap: wrap; }
  .crumbs a:hover { color: var(--text); }
  .crumbs svg { width: 14px; height: 14px; }
  .part-page { display: grid; gap: 20px; }
  .part-head { display: grid; gap: 14px; }
  .part-head .thumb.lg { aspect-ratio: 4 / 3; }
  .part-head .refs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .copy { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
  .copy svg { width: 14px; height: 14px; }
  .fit { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: var(--raised); }
  .fit .src { font-size: 13px; color: var(--muted); }
  .offers { display: grid; gap: 10px; }
  .offer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .offer.best { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .offer .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; }
  .offer .facts { grid-column: 1 / -1; display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .offer .facts span { display: inline-flex; align-items: center; gap: 5px; }
  .offer .facts svg { width: 14px; height: 14px; }
  .offer .facts .warn { color: var(--warning); }
  .offer .buy { display: grid; justify-items: end; gap: 6px; align-content: start; }
  .offer .buy .money { font-size: 18px; font-weight: 600; }
  .best-tag { font-size: 12px; font-weight: 600; color: var(--accent); }

  /* السلة والدفع */
  .grp { display: grid; gap: 4px; }
  .grp-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .grp-head .s { font-weight: 600; }
  .grp-head .m { color: var(--muted); font-size: 13px; }
  .line { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
  .line + .line { border-top: 1px solid var(--rule); }
  .line .info { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--control); border-radius: 999px; height: 34px; }
  .stepper button { width: 34px; height: 32px; border: 0; background: none; display: grid; place-items: center; border-radius: 999px; }
  .stepper button svg { width: 15px; height: 15px; }
  .stepper span { min-width: 22px; text-align: center; font-weight: 600; }
  .why { font-size: 12.5px; color: var(--warning); display: flex; gap: 5px; align-items: flex-start; }
  .why svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
  .addr-opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .addr-opt input { margin: 3px 0 0; accent-color: var(--text); width: 18px; height: 18px; flex: none; }
  .addr-opt[aria-disabled="true"] { opacity: 0.6; cursor: not-allowed; }
  .addr-opt:has(input:checked) { border-color: var(--text); }
  .sum .kv { padding: 5px 0; }
  .sum .total { font-size: 17px; font-weight: 600; border-top: 1px solid var(--rule); margin-top: 6px; padding-top: 12px; }
  .pay-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .pay-opt { height: 48px; border-radius: 12px; border: 1px solid var(--control); background: var(--surface); font-weight: 600; }
  .pay-opt[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .gstate { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--raised); }
  .gstate .row1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .gstate .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .demo-hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* التتبع */
  .otp { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--text); color: var(--surface); }
  .otp .digits { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: 0.3em; direction: ltr; }
  .otp .l { font-size: 13px; opacity: 0.8; }
  .steps { display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0; position: relative; }
  .step .b { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--control); background: var(--surface); margin: 5px 4px 0; position: relative; z-index: 1; }
  .step.done .b { background: var(--text); border-color: var(--text); }
  .step.now .b { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .step:not(:last-child)::after { content: ""; position: absolute; inset-inline-start: 9px; top: 20px; bottom: -6px; width: 2px; background: var(--rule); }
  .step.done:not(:last-child)::after { background: var(--text); }
  .step .t { font-size: 12.5px; color: var(--muted); }
  .step.todo { color: var(--muted); }
  .courier-card { display: flex; gap: 12px; align-items: center; }
  .tl { display: grid; gap: 10px; }
  .tl li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; font-size: 13.5px; }
  .tl .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl .who { font-weight: 500; }

  /* شريط التنقل السفلي */
  .tabbar { position: fixed; inset: auto 0 0 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a { display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 11.5px; position: relative; min-height: 48px; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--text); font-weight: 600; }
  .tabbar .badge { top: 0; inset-inline-start: calc(50% - 22px); }

  .two { display: grid; gap: 16px; }
  .order-row { display: flex; gap: 12px; align-items: center; padding: 14px 0; }
  .order-row + .order-row { border-top: 1px solid var(--rule); }
  .order-row .info { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .garage-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; }
  .garage-row + .garage-row { border-top: 1px solid var(--rule); }
  .garage-row .info { flex: 1; min-width: 0; }
  .vin-result { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--raised); font-size: 13.5px; }

  @media (min-width: 960px) {
    .c-top { padding-top: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); background: var(--surface); margin-bottom: 20px; }
    .c-top .desk { display: flex; }
    .mob { display: none !important; }
    .c-top .brand { font-size: 19px; }
    .tabbar { display: none; }
    .c-main { padding-bottom: 48px; gap: 20px; }
    .crumbs { display: flex; }
    .home-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 20px; align-items: start; }
    .cats { grid-template-columns: repeat(9, minmax(0, 1fr)); }
    .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .slide { flex-basis: calc(50% - 6px); aspect-ratio: 16 / 8; }
    .slide h3 { font-size: 24px; }
    .strip { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; }
    .perks { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .perk { justify-items: start; text-align: start; padding: 14px 16px; font-size: 13px; align-content: center; }
    .part-page { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
    .part-page .part-side { position: sticky; top: 96px; }
    .two { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 20px; align-items: start; }
    .two .stick { position: sticky; top: 96px; }
    .search-page { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
    .search-page .filters { position: sticky; top: 96px; }
    h1.title { font-size: 24px; }
  }
  @media (max-width: 959px) {
    .search-page { display: grid; gap: 14px; }
    .search-page .filters .chips, .part-page .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; max-width: none; }
    .search-page .filters .chips::-webkit-scrollbar { display: none; }
    .part-page .seg { background: none; padding-block: 0; gap: 6px; }
    .part-page .seg button { background: var(--raised); height: 34px; border-radius: 999px; padding: 0 14px; }
    .part-page .seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); box-shadow: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  const { A, fmt, V, P, S, C, D, POLICY } = Store; const U = UI; const me = D.customer;
  const root = document.getElementById('app');
  const PREF_KEY = 'samoola-customer';
  let prefs = { vehicle: 'camry-2021', address: 'a1' };
  try { prefs = { ...prefs, ...JSON.parse(localStorage.getItem(PREF_KEY) || '{}') }; } catch (e) { /* لا تخزين */ }
  const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* لا تخزين */ } };
  const ui = { q: '', onlyFit: true, tier: 'all', sort: 'best', pay: 'مدى', focusSearch: false, tlOpen: false, slide: 0 };

  /* ---------- مساعدات ---------- */
  const veh = (id) => V[id]; const vname = (id) => { const v = V[id]; return `${v.make} ${v.model} ${v.year}`; };
  const catName = (id) => (D.categories.find((c) => c.id === id) || {}).name || '';
  const addr = () => me.addresses.find((a) => a.id === prefs.address) || me.addresses[0];
  const etaTxt = (e) => `\u2066${e.from}–${e.to}\u2069 دقيقة`;
  const norm = (s) => String(s).toLowerCase().replace(/[ً-ْ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
  const normRef = (s) => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const offersOf = (pid) => Store.offersFor(pid);
  const minPrice = (pid) => Math.min(...offersOf(pid).map((o) => o.price));
  const cartCount = () => Store.get().cart.reduce((a, c) => a + c.qty, 0);
  const myOrders = () => Store.get().orders.filter((o) => o.live || o.mine);
  const offerCount = (n) => fmt.count(n, ['عرض واحد', 'عرضان', 'عروض', 'عرضًا']);
  function score(o, all) {
    const minP = Math.min(...all.map((x) => x.price)); const minE = Math.min(...all.map((x) => Store.eta(x.supplier).from));
    return o.price / minP + (Store.eta(o.supplier).from / minE) * 0.5 + (Store.verifyReasons(o).length ? 0.3 : 0) + (D.brands[o.brand].tier === 'eco' ? 0.25 : 0);
  }
  function sortOffers(list) {
    const l = [...list];
    if (ui.sort === 'price') l.sort((a, b) => a.price - b.price);

        ${me.vehicles.map((x) => { const v = V[x.vehicle]; return `<div class="garage-row"><span class="thumb sm" style="background:var(--accent-soft);color:var(--accent)">${U.icon('car')}</span><div class="info"><b>${x.nick}</b><div class="sub small">${vname(v.id)} · ${v.engine}${v.engineCode ? ` ${fmt.ltr(v.engineCode)}` : ''} · ${fmt.ltr(x.vinMasked)}</div></div>${prefs.vehicle === v.id ? U.pill('الحالية', 'info') : `<button class="btn round" type="button" data-veh="${v.id}">اختر</button>`}</div>`; }).join('')}
        <form data-form="vin" style="display:grid;gap:8px;margin-top:12px"><label class="label" for="vin">أضف سيارة برقم الهيكل (VIN)</label>
          <div style="display:flex;gap:8px"><input class="input ref" id="vin" name="vin" maxlength="17" dir="ltr" autocomplete="off" placeholder="17 خانة مطبوعة على الاستمارة"><button class="btn round primary" style="height:40px">تحقق</button></div>
          <div id="vin-out"></div></form></section>
      <section class="card" aria-labelledby="ad-h"><header><h2 id="ad-h">عناويني</h2></header>
        ${me.addresses.map((x) => `<div class="garage-row"><span class="thumb sm">${U.icon('pin')}</span><div class="info"><b>${x.label} · ${x.district}</b><div class="sub small">${x.street} · ${fmt.ltr(x.nationalAddress)}</div></div>${x.inZone ? '' : U.pill('خارج الخدمة', 'neutral')}</div>`).join('')}</section>
    </div>
    <aside style="display:grid;gap:16px;min-width:0">
      <section class="card" aria-labelledby="th-h"><header><h2 id="th-h">المظهر</h2></header>${U.themeSeg()}</section>
      <section class="card" aria-labelledby="dm-h" style="background:var(--raised);border-style:dashed"><header><h2 id="dm-h">أدوات العرض</h2></header>
        <div style="display:grid;gap:12px">
          <label class="check"><input type="checkbox" class="switch" data-demo="autoVendor" ${st.demo.autoVendor ? 'checked' : ''}><span><b>رد المورد تلقائيًا</b><span class="sub small" style="display:block">لعرض الرحلة على جهاز واحد دون فتح واجهة المورد</span></span></label>
          <label class="check"><input type="checkbox" class="switch" data-demo="autoCourier" ${st.demo.autoCourier ? 'checked' : ''}><span><b>توصيل تلقائي</b><span class="sub small" style="display:block">مندوب محاكى يقبل المهمة ويكملها</span></span></label>
          <button class="btn round danger" type="button" data-act="reset">أعد ضبط بيانات العرض</button>
          <a class="link" href="index.html">كل الواجهات</a>
        </div></section>
    </aside></div>`;
  }

  /* ---------- الرسم ---------- */
  function page() {
    const r = route(); let body = '';
    if (r.view === 'home') body = home(); else if (r.view === 'search') body = searchView(r); else if (r.view === 'part') body = partView(r.id);
    else if (r.view === 'cart') body = cartView(); else if (r.view === 'order') body = orderView(r.id); else if (r.view === 'orders') body = ordersView(); else body = accountView();
    return header(r) + `<main class="c-main" id="main">${body}</main>` + tabbar(r);
  }
  const paint = U.renderer(root, page);
  const render = () => { paint(); carousel(); };

  /* ---------- شرائح الإعلانات ---------- */
  // الرسم يعيد بناء الصفحة، فنحفظ رقم الشريحة ونعيد التمرير إليها دون حركة
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let slideTimer = null; let slidePaused = false;
  function slideTo(track, i, smooth) {
    const slides = track.children; if (!slides[i]) return;
    const delta = slides[i].getBoundingClientRect().right - track.getBoundingClientRect().right;
    track.scrollBy({ left: delta, behavior: smooth && !reduced ? 'smooth' : 'auto' });
  }
  function markSlide(track, i) {
    ui.slide = i;
    [...track.children].forEach((el, k) => el.classList.toggle('is-on', k === i));
    root.querySelectorAll('[data-slide]').forEach((b) => b.setAttribute('aria-current', String(Number(b.dataset.slide) === i)));
  }
  function carousel() {
    const track = root.querySelector('[data-track]'); clearInterval(slideTimer); if (!track) return;
    slideTo(track, ui.slide, false);
    let raf = 0;
    track.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => {
      const r = track.getBoundingClientRect().right; let best = 0, d = Infinity;
      [...track.children].forEach((el, k) => { const x = Math.abs(el.getBoundingClientRect().right - r); if (x < d) { d = x; best = k; } });
      if (best !== ui.slide) markSlide(track, best);
    }); }, { passive: true });
    ['pointerdown', 'focusin', 'mouseenter'].forEach((ev) => track.addEventListener(ev, () => { slidePaused = true; }));
    track.addEventListener('mouseleave', () => { slidePaused = false; });
    if (!reduced) slideTimer = setInterval(() => {
      if (slidePaused || document.hidden) return;
      const n = track.children.length; const per = Math.round(track.clientWidth / track.children[0].clientWidth) || 1;
      slideTo(track, (ui.slide + 1) % Math.max(1, n - per + 1), true);
    }, 5000);
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); if (ui.focusSearch) { ui.focusSearch = false; const i = root.querySelector('#q-s') || root.querySelector('#q-top'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } });
  Store.on(render); render();

  /* ---------- الأحداث ---------- */
  root.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-add], [data-act]'); if (!t) return;
    const d = t.dataset;
    if (d.slide) { const track = root.querySelector('[data-track]'); slidePaused = true; slideTo(track, Number(d.slide), true); }
    else if (d.add) { A.addToCart(d.add); U.toast('أُضيفت إلى السلة'); }
    else if (d.qty) { const c = Store.get().cart.find((x) => x.offer === d.qty); A.setQty(d.qty, c.qty + Number(d.d)); }
    else if (d.sort) { ui.sort = d.sort; render(); }
    else if (d.tier) { ui.tier = d.tier; render(); }
    else if (d.pay) { ui.pay = d.pay; render(); }
    else if (d.copy) { const done = () => U.toast(`نُسخ ${d.copy}`); try { navigator.clipboard.writeText(d.copy).then(done, () => U.toast(d.copy)); } catch (err) { U.toast(d.copy); } }
    else if (d.veh) { prefs.vehicle = d.veh; savePrefs(); render(); U.toast(`السيارة الحالية: ${vname(d.veh)}`); }
    else if (d.drop) { A.dropGroup(d.o, d.drop); }
    else if (d.retry) { A.retryGroup(d.o, d.retry); }
    else if (d.act === 'onlyfit') { ui.onlyFit = !ui.onlyFit; render(); }
    else if (d.act === 'quote') { const id = A.createQuote(prefs.address, prefs.vehicle); go('order-' + id); }
    else if (d.act === 'pay') { const r = A.pay(d.id, ui.pay); if (r !== 'ok') U.toast('لا يمكن الدفع: لم تُحجز كل القطع'); }
    else if (d.act === 'cancel') { A.cancelQuote(d.id); }
    else if (d.act === 'sim-accept') { A.respond(d.g, true); U.toast('أكد المورد التوفر (محاكاة)'); }
    else if (d.act === 'tl') { ui.tlOpen = !ui.tlOpen; render(); }
    else if (d.act === 'reset') { A.reset(); U.toast('أُعيد ضبط العرض'); go('home'); }
    else if (d.act === 'vehicle') vehicleSheet();
    else if (d.act === 'address') addressSheet();
  });
  root.addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'addr') { prefs.address = t.value; savePrefs(); render(); }
    if (t.dataset.demo) A.setDemo(t.dataset.demo, t.checked);
  });
  root.addEventListener('focusin', (e) => { if (e.target.matches('[data-goto-search]')) { ui.focusSearch = true; go('search'); } });
  root.addEventListener('input', (e) => {
    if (e.target.name !== 'q') return; ui.q = e.target.value;
    if (route().view === 'search' || route().view === 'part') { if (route().view !== 'search') { ui.focusSearch = true; go('search'); return; } const box = root.querySelector('#results'); const html = searchView(route()); const tmp = document.createElement('div'); tmp.innerHTML = html; const nr = tmp.querySelector('#results'); const nh = tmp.querySelector('#res-h'); if (box && nr) box.innerHTML = nr.innerHTML; const oh = root.querySelector('#res-h'); if (oh && nh) { oh.innerHTML = nh.innerHTML; oh.nextElementSibling.innerHTML = nh.nextElementSibling.innerHTML; } }
  });
  root.addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target;
    if (f.dataset.form === 'search') { ui.q = f.q.value.trim(); ui.focusSearch = false; go('search'); render(); }
    if (f.dataset.form === 'vin') vinCheck(f.vin.value);
  });

  function vinCheck(raw) {
    const vin = raw.trim().toUpperCase(); const out = root.querySelector('#vin-out'); let html;
    if (vin.length !== 17) html = `<p class="small" style="color:var(--negative)">رقم الهيكل 17 خانة؛ أدخلت ${vin.length}.</p>`;
    else if (/[IOQ]/.test(vin) || !/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) html = '<p class="small" style="color:var(--negative)">الأحرف I وO وQ لا تُستخدم في رقم الهيكل؛ تحقق من الخانات.</p>';
    else {
      const wmi = vin.slice(0, 3); const match = D.vehicles.filter((v) => v.wmi === wmi);
      html = `<div class="vin-result"><b>الصيغة صحيحة · رمز الصانع ${fmt.ltr(wmi)}${match.length ? ` (${match[0].make})` : ''}</b>
        <span>فك الرقم كاملًا يحتاج مصدرًا مرخصًا يغطي مواصفات الخليج (قرار D-08). قاعدة vPIC الأمريكية محدودة لهذه السيارات، لذلك نطلب تأكيد الطراز والمحرك:</span>
        ${(match.length ? match : D.vehicles.slice(0, 4)).map((v) => `<button class="btn round" type="button" data-veh="${v.id}" style="justify-self:start">${vname(v.id)} · ${v.engine}</button>`).join('')}</div>`;
    }
    out.innerHTML = html;
  }
  function vehicleSheet() {
    const d = U.dialog(`<div class="sheet-head"><h2>اختر السيارة</h2><button class="btn ghost icon" data-close aria-label="إغلاق">${U.icon('x')}</button></div>
      <div class="sheet-body"><div class="rows">${me.vehicles.map((x) => `<button class="garage-row" type="button" data-pick="${x.vehicle}" style="width:100%;background:none;border:0;text-align:start">${U.icon('car')}<span class="info"><b>${x.nick}</b><span class="sub small" style="display:block">${vname(x.vehicle)} · ${V[x.vehicle].engine}</span></span>${prefs.vehicle === x.vehicle ? U.pill('الحالية', 'info') : ''}</button>`).join('')}</div>
      <div class="field"><label for="other-v">سيارة أخرى من القائمة</label><select class="input" id="other-v">${D.vehicles.map((v) => `<option value="${v.id}" ${v.id === prefs.vehicle ? 'selected' : ''}>${vname(v.id)} · ${v.engine}</option>`).join('')}</select><span class="hint">القائمة من أكثر السيارات مبيعًا في السعودية 2025.</span></div></div>
      <div class="sheet-foot"><button class="btn round primary" data-pick-select>اعتمد</button></div>`);
    d.addEventListener('click', (e) => { const b = e.target.closest('[data-pick],[data-pick-select]'); if (!b) return; prefs.vehicle = b.dataset.pick || d.querySelector('#other-v').value; savePrefs(); d.close(); render(); });
  }
  function addressSheet() {
    const d = U.dialog(`<div class="sheet-head"><h2>التوصيل إلى</h2><button class="btn ghost icon" data-close aria-label="إغلاق">${U.icon('x')}</button></div>
      <div class="sheet-body">${me.addresses.map((x) => `<label class="addr-opt" ${x.inZone ? '' : 'aria-disabled="true"'}><input type="radio" name="addr-s" value="${x.id}" ${x.id === prefs.address ? 'checked' : ''} ${x.inZone ? '' : 'disabled'}><span style="display:grid;gap:2px"><b>${x.label} · ${x.district}</b><span class="sub small">${x.inZone ? x.zone : 'خارج منطقة الخدمة حاليًا'}</span></span></label>`).join('')}</div>`);
    d.addEventListener('change', (e) => { prefs.address = e.target.value; savePrefs(); d.close(); render(); });
  }
})();
</script>
</body>
</html>
